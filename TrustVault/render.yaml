# Render Blueprint: creates the web service AND a PostgreSQL database in one click.
# Dashboard -> New -> Blueprint -> pick this repository. Secrets are generated by Render
# (random 256-bit values) and never stored in the repository.
services:
  - type: web
    name: trustvault
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m trustvault serve --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TRUSTVAULT_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trustvault-db
          property: connectionString
      - key: TRUSTVAULT_MASTER_KEY        # wraps every file's data key. Back it up: losing it loses the files.
        generateValue: true
      - key: TRUSTVAULT_AUDIT_KEY         # signs the audit chain. Separate from the master key on purpose.
        generateValue: true
      - key: TRUSTVAULT_DEMO_MODE         # protects the seeded demo accounts so every reviewer can sign in
        value: "true"
      - key: TRUSTVAULT_SEED_DEMO         # seed demo users + sample documents on first start (empty DB only)
        value: "true"
      - key: TRUSTVAULT_TRUST_PROXY_HOPS  # Render terminates TLS in front of the app
        value: "1"

databases:
  - name: trustvault-db
    plan: free
    databaseName: trustvault
    user: trustvault
    ipAllowList: []   # no public access; only services inside Render can connect
